# The workflow runs the make targets `make ci` runs, each as a step of its own
# so the Actions page shows which check failed and how long each took. A green
# local `make ci-docker` predicts a green run here. The step list below and the
# `ci` target's prerequisites in the Makefile must stay in sync: a check added
# to one belongs in the other. Every step runs its make target in the CI image
# (.github/Dockerfile) through .github/in-image.sh. Two differences, on
# purpose: `typos` runs first, since a prose-only change runs it alone, and
# `test-integration` runs in the `integration` job, beside the `checks` job
# rather than in it, so its headless shells don't hold up the linters and
# the unit tests. Around the `coverage` step, the job summary and the
# `coverage` artifact are runner steps with no make target, and the
# `coverage-comment` job posts the summary to the pull request.
#
# Linux only. Don't add a job that assumes Windows or macOS.
#
# Every job names its runner image, `ubuntu-26.04`, rather than
# `ubuntu-latest`, so GitHub doesn't move it on its own schedule. The checks
# run in the CI image, whose Ubuntu ships the GNOME Shell the extension
# targets; the runner only supplies Docker. Move both together.
#
# The last job, `ci`, is the check for the `main` ruleset to require: it passes
# only when every other job passed or was skipped. Keep its name and the
# workflow's: renamed, a required check never arrives and every pull request
# waits on it.

name: ci

# Pull requests, and pushes to `main` so a merge is known green.
#
# No `paths` filter here. A workflow that never starts reports no status at
# all, so a required check would wait forever. Skipping work belongs on the
# jobs and steps.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels the run on its old head. Every run on
# `main` finishes, so each merge is known green or red.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Whether anything but prose changed: Markdown anywhere, `docs/`, or agent
  # tooling under `.claude/`. The list names what to skip, not what to build,
  # so a file type nobody listed builds, and a diff git can't take counts as
  # code. A manual run has no changed files and skips the filter, so `code` is
  # empty and everything runs. The workflow decides this, never `make ci`,
  # which doesn't look at the diff.
  changes:
    runs-on: ubuntu-26.04
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      # Full history, for the merge base of a pull request's two ends.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # A pull request's whole diff from its merge base, or a push's commits.
      - id: filter
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          RANGE: >-
            ${{ github.event_name == 'pull_request'
              && format('{0}...{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha)
              || format('{0}..{1}', github.event.before, github.sha) }}
        run: |
          code=false
          # When git can't take the range (a new branch's zero `before`, a
          # force-push), the echo is a line no pattern skips, so code=true.
          while IFS= read -r file; do
            case "$file" in
              *.md | docs/* | .claude/*) ;;
              *) code=true ;;
            esac
          done < <(git diff --name-only "$RANGE" || echo "the diff failed")
          echo "code=$code" >> "$GITHUB_OUTPUT"

  checks:
    needs: changes
    runs-on: ubuntu-26.04
    outputs:
      coverage-report: ${{ steps.coverage-report.outputs.markdown }}
      coverage-artifact-url: ${{ steps.coverage-artifact.outputs.artifact-url }}
    steps:
      # The merge commit's parents too, for the coverage step's diff against
      # the pull request's base.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      # The CI image (.github/actions/ci-image). This job alone writes its
      # layer cache.
      - name: ci image
        uses: ./.github/actions/ci-image
        with:
          write-cache: "true"

      # The spell-check reads prose too, so it runs on every change.
      - name: typos
        run: .github/in-image.sh make typos

      - name: lint-js
        if: needs.changes.outputs.code != 'false'
        run: .github/in-image.sh make lint-js
      - name: lint-sh
        if: needs.changes.outputs.code != 'false'
        run: .github/in-image.sh make lint-sh
      - name: lint-py
        if: needs.changes.outputs.code != 'false'
        run: .github/in-image.sh make lint-py
      - name: lint-actions
        if: needs.changes.outputs.code != 'false'
        run: .github/in-image.sh make lint-actions
      # The unit tests, with coverage; `make ci` runs them the same way. Under
      # GitHub Actions the runner also prints a failing test as an ::error
      # annotation. A failing test fails the step; the coverage figures never
      # do. On a pull request the checkout is GitHub's merge of its branch into
      # the base, and the merge's first parent is the base it was built on, so
      # the lines changed since it are the pull request's own. The event's
      # base SHA isn't: it doesn't move when `main` does before a re-run.
      - name: coverage
        if: needs.changes.outputs.code != 'false'
        env:
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}
        run: .github/in-image.sh make coverage ${BASE:+BASE="$BASE"}
      - name: coverage summary
        id: coverage-report
        if: needs.changes.outputs.code != 'false'
        run: |
          cat dist/coverage/summary.md >> "$GITHUB_STEP_SUMMARY"
          {
            echo 'markdown<<END_OF_COVERAGE_REPORT'
            cat dist/coverage/summary.md
            echo END_OF_COVERAGE_REPORT
          } >> "$GITHUB_OUTPUT"
      - name: upload coverage
        id: coverage-artifact
        if: needs.changes.outputs.code != 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            dist/coverage/html
            dist/coverage/coverage.lcov
            dist/coverage/summary.md
      - name: pack
        if: needs.changes.outputs.code != 'false'
        run: .github/in-image.sh make pack

  # The integration tests: two headless GNOME Shells, English and German,
  # against the mock UPower (tests/integration/run.sh). Each pass's log goes
  # up as the `integration-logs` artifact on every run, pass or fail, with a
  # screenshot of each failed test. docs/agents/gnome-shell-testing.md lists
  # what the shell needs in a container.
  integration:
    needs: changes
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-26.04
    # Each pass times out after 3 minutes, but a stuck shell outlives its
    # pass until the container exits. This bounds the whole job.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The same image as the `checks` job, from the layer cache that job
      # writes.
      - name: ci image
        uses: ./.github/actions/ci-image
      - name: test-integration
        run: .github/in-image.sh make test-integration
      # Each pass's log and its mock UPower's log, and a screenshot of each
      # failed test. Not the whole directory: it also holds each pass's FIFO,
      # which the upload can't read.
      - name: upload integration logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-logs
          path: |
            dist/integration/*.log
            dist/integration/*.png

  # Replaces the pull request's coverage comment with the newest report. A
  # separate job so only it holds the token that writes comments, and it runs
  # no build or test. It never runs for a pull request from a fork, whose
  # token is read-only anyway: those keep the job summary and the artifact.
  # Not a need of `ci`: a comment that fails to post doesn't block a merge.
  coverage-comment:
    needs: checks
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && needs.checks.outputs.coverage-report != ''
    runs-on: ubuntu-26.04
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ needs.checks.outputs.coverage-report }}
          ARTIFACT_URL: ${{ needs.checks.outputs.coverage-artifact-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          {
            printf '%s\n\n' "$REPORT"
            echo "📦 [Download the HTML report and lcov]($ARTIFACT_URL) · [run]($RUN_URL) · \`${HEAD_SHA:0:7}\`"
          } > "$RUNNER_TEMP/coverage-comment.md"
          .github/post-coverage-comment.sh "$PR" "$RUNNER_TEMP/coverage-comment.md"

  # The required check. A job a prose-only change skips counts as passed.
  ci:
    needs: [changes, checks, integration]
    if: always()
    runs-on: ubuntu-26.04
    steps:
      - name: every job passed or was skipped
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
